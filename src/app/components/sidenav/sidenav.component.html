<div class="sidenav">
  <a class="logo" routerLink="/"
    ><i class="bx bx-camera-movie"></i>Moon<span>Flix</span></a
  >
  <mat-divider></mat-divider>
  <mat-nav-list>
    <div class="menu__list menu">
      <div class="menu__title">Menu</div>
      <a
        mat-list-item
        routerLink="/home"
        class="menu__item"
        routerLinkActive="list-item-active"
      >
        <mat-icon>home</mat-icon>Home
      </a>
      <a
        mat-list-item
        routerLink="/movie"
        class="menu__item"
        routerLinkActive="list-item-active"
      >
        <mat-icon>movie</mat-icon>Movie
      </a>
      <a
        mat-list-item
        routerLink="/series"
        class="menu__item"
        routerLinkActive="list-item-active"
      >
        <mat-icon>tv</mat-icon>TV Series
      </a>
    </div>
    <mat-divider></mat-divider>
    <div class="menu__list">
      <div class="menu__title">MediaList</div>
      <a
        mat-list-item
        routerLink="/movie-now-playing"
        class="menu__item"
        routerLinkActive="list-item-active"
      >
        <mat-icon>play_arrow</mat-icon>Now Playing
      </a>
      <a
        mat-list-item
        routerLink="/movie-popular"
        routerLinkActive="list-item-active"
      >
        <mat-icon>trending_up</mat-icon>Popular
      </a>
      <a
        mat-list-item
        routerLink="/movie-top-rating"
        routerLinkActive="list-item-active"
      >
        <mat-icon>grade</mat-icon>Top Rating
      </a>
    </div>
    <mat-divider></mat-divider>
    <div class="menu__list">
      <div class="menu__title">Library</div>
      <a
        mat-list-item
        routerLink="/favourite-movie"
        routerLinkActive="list-item-active"
      >
        <i class="bx bxs-heart"></i>Favourite
      </a>
      <a
        mat-list-item
        routerLink="/watch-list-movie"
        routerLinkActive="list-item-active"
      >
        <i class="bx bxs-bookmark-star"></i>WatchList
      </a>
    </div>
    <!-- <mat-divider></mat-divider> -->
  </mat-nav-list>
  @if(authService.isAuthenticationSignal()){
  <mat-divider></mat-divider>
  <div class="logout">
    <button type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>Logout
    </button>
  </div>
  }
</div>
