<header class="header">
  <div class="header__body">
    <button mat-icon-button (click)="toggleSidebar()" class="menu-icon">
      <mat-icon>menu</mat-icon>
    </button>
    <nav class="header__nav">
      @if(authService.isAuthenticationSignal()){
      <button class="search-button" routerLink="/search">
        Search <mat-icon>search</mat-icon>
      </button>
      }
    </nav>
    <div class="header__actions action">
      @if(!authService.isAuthenticationSignal()){
      <button
        type="button"
        class="action__auth"
        mat-raised-button
        (click)="openAuthorizationForm()"
      >
        Гість
      </button>
      }@else{
      <button type="button" class="user__logo">
        <small>{{ userName | firstLetterUserName }}</small>
      </button>
      }
    </div>
  </div>
</header>
